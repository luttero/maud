# Builds Maud.jar from this repository with ant (target build_full) and installs
# it, with the third-party jars of libs/current, into $PREFIX/share/maud/lib.
# noarch: jars only; the JVM is conda-forge's openjdk. The build scripts are
# build.sh (Linux, macOS) and build.bat (Windows); each fails if the version
# below differs from maud_version in src/it/unitn/ing/rista/util/Constants.java.
package:
  name: maud
  version: "3.09"

source:
  path: ..
  filter:
    exclude:
      - .git/**

build:
  number: 0
  noarch: generic

requirements:
  build:
    # Java 21 gives class files identical to the official release.
    - openjdk 21.*
    - ant
  run:
    # MAUD needs Java 21 or later; Java 26 removed java.applet, which MAUD uses.
    - openjdk >=21,<26

tests:
  - package_contents:
      files:
        - share/maud/lib/Maud.jar
        - share/maud/lib/Files.jar

about:
  homepage: https://github.com/luttero/Maud
  repository: https://github.com/luttero/Maud
  license: BSD-3-Clause
  license_file:
    - LICENSE
    - src/help/license_maud.txt
    - src/license/lesser.txt
    - src/license/license_superflip.txt
    - src/license/SciMark.txt
  summary: MAUD (Materials Analysis Using Diffraction), jars to run with java -cp share/maud/lib/*
  description: |
    MAUD built from source. share/maud/lib also holds the third-party jars of
    libs/current, which keep their own licences; the licence texts in the
    repository are installed with the package.
